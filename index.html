<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helufood-cơm văn phòng</title>
    <link rel="icon" type="image/png" href="./services/customer/img/logo.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0"></script>
    <style>
        :root {
            --bg: #ffffff;
            --card: #ffffff;
            --line: #f1f5f9;
            --text: #0f172a;
            --muted: #64748b;
            --primary: #f97316; /* Màu cam thực phẩm hiện đại */
            --primary-hover: #ea580c;
            --red: #ef4444;
            --blue: #3b82f6;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
            color: var(--text);
            background-color: #fdfdfd;
            background-image: 
                radial-gradient(at 0% 0%, rgba(249, 115, 22, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(249, 115, 22, 0.05) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(59, 130, 246, 0.05) 0px, transparent 50%);
            display: grid;
            place-items: center;
            padding: 28px;
        }

        .gateway {
            width: min(480px, 100%);
        }

        .hero {
            width: 100%;
            margin-bottom: 28px;
            text-align: center;
            margin-inline: auto;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .main-logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: contain;
            background: var(--primary); /* Sử dụng nền màu cam để đồng bộ với tiêu đề */
            padding: 12px;
            box-shadow: 0 20px 25px -5px rgba(249, 115, 22, 0.1), 0 8px 10px -6px rgba(249, 115, 22, 0.1);
            border: 4px solid #fff;
            margin-bottom: 16px;
            animation: float 4s ease-in-out infinite;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(32px, 5vw, 42px);
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, var(--primary), #fb923c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            margin: 0;
            color: var(--muted);
            font-weight: 500;
            font-size: 16px;
        }

        .card {
            background: var(--card);
            border: 1px solid rgba(241, 245, 249, 0.8);
            border-radius: 28px;
            padding: 26px;
            box-shadow: 
                0 1px 3px 0 rgba(0, 0, 0, 0.01),
                0 20px 25px -5px rgba(0, 0, 0, 0.05),
                0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        .icon {
            width: 54px;
            height: 54px;
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 18px;
        }

        .icon.staff { background: rgba(249, 115, 22, 0.1); color: var(--primary); }

        .card h2 {
            margin: 0 0 24px;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 999px;
            background: #fff;
            border: 1px solid #e2e8f0;
            color: var(--text);
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .button,
        .login-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            margin-top: 8px;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 14px;
            font-weight: 800;
            color: white;
            border: none;
            font: inherit;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .login-button {
            background: linear-gradient(135deg, var(--primary), #fb923c);
            box-shadow: 0 10px 15px -3px rgba(249, 115, 22, 0.3);
        }

        .button.customer {
            background: #f8fafc;
            color: var(--text);
            border: 1px solid var(--line);
            margin-top: 24px;
        }

        .button:hover,
        .login-button:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }

        .button.customer:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .staff-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .form-block {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-block label {
            font-size: 13px;
            font-weight: 700;
            color: var(--muted);
            padding-left: 4px;
        }

        .form-block input {
            width: 100%;
            padding: 15px 18px;
            border-radius: 14px;
            border: 2px solid #f1f5f9;
            background: #f8fafc;
            color: var(--text);
            font: inherit;
            transition: all 0.2s;
        }

        .form-block input:focus {
            outline: none;
            border-color: #fb923c;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.1);
        }

        .login-error {
            min-height: 18px;
            color: var(--red);
            font-size: 13px;
            font-weight: 500;
            text-align: center;
        }

        .login-note {
            margin-top: 20px;
            font-size: 13px;
            text-align: center;
            border-top: 1px solid var(--line);
            padding-top: 20px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .divider {
            height: 1px;
            background: var(--line);
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <main class="gateway">
        <section class="hero">
            <img src="./services/customer/img/logo.png" alt="Logo" class="main-logo">
            <h1>Helufood</h1>
            <p>Giải pháp cơm văn phòng thông minh</p>
        </section>
        <article class="card">
            <h2>Đăng nhập nhân sự</h2>
            <form class="staff-form" id="staffLoginForm">
                <div class="form-block">
                    <label for="email">Địa chỉ Email</label>
                    <input id="email" name="email" type="email" placeholder="name@helufood.com" required>
                </div>
                <div class="form-block">
                    <label for="password">Mật khẩu</label>
                    <input id="password" name="password" type="password" placeholder="••••••••" required>
                </div>
                <div class="login-error" id="loginError"></div>
                <button class="login-button" id="loginButton" type="submit">
                    <span>Đăng nhập hệ thống</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>
            <a class="button customer" href="./services/customer/index.html">
                <i class="fas fa-shopping-basket"></i>
                <span>Vào trang khách đặt món</span>
            </a>
            <p class="login-note">Hệ thống quản lý dành riêng cho <strong>Admin</strong> và <strong>Nhà bếp</strong>.</p>
        </article>
    </main>

    <script type="module" src="./services/shared/js/gateway-login.js"></script>
</body>
</html>
